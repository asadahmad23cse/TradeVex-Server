version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: btc-intel-backend
    env_file:
      - .env
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  redis:
    image: redis:7-alpine
    container_name: btc-intel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
