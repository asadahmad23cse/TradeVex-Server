version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: btc-intel-backend
    env_file:
      - .env
    ports:
      - "9000:9000"
    depends_on:
      - redis
    volumes:
      - ./:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: btc-intel-frontend
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:9000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: btc-intel-redis
    ports:
      - "6379:6379"
