watchlist:
  indian_stocks:
    - { symbol: RELIANCE,   yf_ticker: RELIANCE.NS,   name: Reliance Industries, asset_class: indian_stock }
    - { symbol: TCS,        yf_ticker: TCS.NS,        name: TCS,                 asset_class: indian_stock }
    - { symbol: INFY,       yf_ticker: INFY.NS,       name: Infosys,             asset_class: indian_stock }
    - { symbol: HCLTECH,    yf_ticker: HCLTECH.NS,    name: HCL Technologies,    asset_class: indian_stock }
    - { symbol: TATAMOTORS, yf_ticker: TATAMOTORS.NS, name: Tata Motors,         asset_class: indian_stock, alt_ticker: TATAMOTORS.BO }

  us_stocks:
    - { symbol: NVDA, yf_ticker: NVDA, name: NVIDIA,     asset_class: us_stock }
    - { symbol: AAPL, yf_ticker: AAPL, name: Apple,      asset_class: us_stock }
    - { symbol: MSFT, yf_ticker: MSFT, name: Microsoft,  asset_class: us_stock }
    - { symbol: TSLA, yf_ticker: TSLA, name: Tesla,      asset_class: us_stock }
    - { symbol: AMZN, yf_ticker: AMZN, name: Amazon,     asset_class: us_stock }

  crypto:
    - { symbol: BTC, binance_ticker: BTCUSDT, name: Bitcoin,  asset_class: crypto }
    - { symbol: ETH, binance_ticker: ETHUSDT, name: Ethereum, asset_class: crypto }
    - { symbol: SOL, binance_ticker: SOLUSDT, name: Solana,   asset_class: crypto }
    - { symbol: XRP, binance_ticker: XRPUSDT, name: Ripple,   asset_class: crypto }
    - { symbol: BNB, binance_ticker: BNBUSDT, name: BNB,      asset_class: crypto }

  forex: []

focus_assets:
  - symbol: XAUUSD
    yf_ticker: GC=F
    name: Gold
    market: metals
    quote_currency: USD
  - symbol: XAGUSD
    yf_ticker: SI=F
    name: Silver
    market: metals
    quote_currency: USD
  - symbol: BTCUSD
    yf_ticker: BTC-USD
    name: Bitcoin
    market: crypto
    quote_currency: USD

focus_validation:
  horizons:
    - interval: "5m"
      period: "5d"
    - interval: "15m"
      period: "5d"
    - interval: "1h"
      period: "1mo"

benchmarks:
  nifty: "^NSEI"
  sp500: "SPY"
  dxy: "DX-Y.NYB"

signal:
  alpha_score_threshold: 0.15
  ic_window: 60
  min_confidence: 50.0
  min_sqs: 55
  dedup_hours: 4
  cooldown_same_direction_min: 12
  cooldown_any_signal_min: 3
  min_holding_candles: 2

force_signals_outside_hours: true

risk:
  max_daily_drawdown_pct: 5.0
  max_open_positions: 8
  max_position_size_pct: 5.0
  cold_start_position_pct: 2.0
  kelly_fraction: 0.25
  min_kelly_trades: 30
  correlation_threshold: 0.7
  max_indian_exposure_pct: 40.0
  max_us_exposure_pct: 40.0
  max_forex_exposure_pct: 20.0
  var_limit_pct: 3.0
  cvar_limit_pct: 4.0
  bear_correlation_threshold: 0.5

portfolio:
  initial_capital: 100000.0
  risk_free_rate: 0.05

market_hours:
  nse:
    open: "09:15"
    close: "15:30"
    timezone: "Asia/Kolkata"
  nyse:
    open: "09:30"
    close: "16:00"
    timezone: "America/New_York"

data:
  intraday_interval: "5m"
  intraday_lookback: "1d"
  daily_lookback: "2y"
  hurst_window: 60
  hmm_train_window: 252
  hmm_retrain_days: 7
  ttl_intraday_sec: 240
  ttl_daily_sec: 3600

slippage:
  indian_stock: 0.0003
  us_stock: 0.0001
  forex_major: 0.00005
  forex_minor: 0.0001

dashboard:
  host: "127.0.0.1"
  port: 8000
  auth:
    enabled: true
    provider: "supabase"   # "local" | "supabase"
    allowed_emails: []  # optional allowlist; empty allows authenticated active subscribers
    require_active_subscription: true
    username: "admin"
    password: "change-me"
    jwt_secret: "change-this-secret"
    supabase_url: "https://cfhoqvebeyawyyufsxuu.supabase.co"       # fallback to SUPABASE_URL env
    supabase_anon_key: "sb_publishable_zRyfWpy4msJl9g3A_ZTKuA_lX9SnA8L"  # fallback to SUPABASE_ANON_KEY env

wfo:
  min_train_days: 252
  oos_step_days: 21
  ir_threshold: 0.3
  alpha_thresholds: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45]
  ic_windows: [30, 45, 60, 75, 90]

# GAP 2 — Almgren-Chriss Transaction Cost Model
cost_model:
  market_impact_coefficient: 0.6   # η in AC model (0.6 = conservative)
  half_spread:
    indian_stock: 0.0002
    us_stock: 0.0001
    forex: 0.00005

# GAP 3 — HRP Portfolio Optimizer
optimizer:
  lookback_days: 60             # covariance estimation window
  max_position_pct: 5.0         # hard cap per asset (%)
  min_position_pct: 0.5         # minimum allocation per asset (%)
  shrinkage_method: ledoit_wolf  # 'ledoit_wolf' | 'sample'
  run_on_eod: true               # recompute weights each EOD

# GAP 6 — Alternative Data (free sources)
alternative_data:
  fii_dii: true            # NSE FII/DII daily flows
  nse_pcr: true            # NIFTY Put/Call Ratio
  google_trends: false     # pytrends (set true if pytrends installed)
  cache_ttl_seconds: 3600  # 1-hour cache TTL
  trend_keywords:
    - "NSE"
    - "Nifty"
    - "Indian stocks"

# GAP 4 — Factor Decay Monitor thresholds
factor_decay:
  decay_ic_21d: -0.05    # IC_21d below this triggers decay
  decay_ic_63d: 0.0      # IC_63d must also be negative
  recovery_days: 10      # bars for linear weight recovery

# Execution Engine (Gap 3)
execution:
  broker: paper             # 'paper' | 'zerodha'
  api_key: ""               # Zerodha API key (from .env)
  access_token: ""          # Zerodha access token (from .env)
  initial_capital: 100000   # paper trading starting capital
  max_slippage_multiple: 2.0
  eta_calibration_min_samples: 30

database:
  url: "data/signals.db"    # sqlite path or full postgres URL

data_quality:
  stale_bars: 3
  spike_sigma: 5.0
  spike_lookback: 20

secondary_validation:
  mismatch_threshold_pct: 0.5
  polygon_api_key: ""
  alpaca_api_key: ""
  alpaca_secret_key: ""
  alpha_vantage_key: ""

watchdog:
  enabled: true
  intraday_expected_min: 7
  eod_expected_min: 1440
  watchdog_expected_min: 2
  alert_cooldown_min: 30

notifications:
  enabled: false
  telegram:
    bot_token: ""
    chat_id: ""
  email:
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    from: ""
    to: []
    use_tls: true

ml_validation:
  oot_days: 60
  lstm_min_oot_accuracy: 0.52
  lstm_retrain_days: 63

regime:
  n_states: 5

# ML Ensemble (Gap 2)
ensemble:
  enabled: true
  retrain_days: 21          # retrain every 21 trading days
  n_estimators: 200
  max_depth: 5
  min_train_rows: 252
  forward_horizon: 5        # predict 5-day forward return

# Capacity Testing (Gap 4)
capacity:
  aum_levels:
    - 1000000      # ₹10L
    - 5000000      # ₹50L
    - 10000000     # ₹1Cr
    - 50000000     # ₹5Cr
    - 100000000    # ₹10Cr

# Step 1 — Expected Returns (returns-first portfolio construction)
expected_returns:
  vol_target: 0.12         # 12% annualised target vol
  shrinkage: 0.3           # Bayesian shrinkage toward zero
  horizon_days: 5          # 5-day forecast horizon

# Step 2 — Execution Simulator (microstructure realism)
execution_sim:
  latency_min_ms: 50
  latency_max_ms: 1500
  permanent_gamma: 0.1     # permanent impact coefficient
  temporary_eta: 0.6       # temporary impact coefficient
  adv_default: 10000000    # default average daily volume (INR)

# Step 7 — Meta-Strategy Layer
meta_model:
  momentum_smoothing: 0.7
  # Override regime multipliers if needed (defaults in meta_model.py)

# Step 8 — Factor Crowding
crowding:
  threshold_class: 0.6     # 60% same-direction within asset class → halve position
  threshold_global: 0.75   # 75% same-direction across all → halve position

# Step 4 — Research Validation
research:
  dsr_significance: 0.05   # DSR > 0 required to deploy
  pbo_max: 0.5             # PBO < 0.5 required to deploy
  pbo_partitions: 10       # CSCV partitions

# Temporal Attention Transformer (Gap 2)
attention_model:
  seq_len: 60              # lookback window in bars
  d_model: 64              # embedding dimension
  n_heads: 4               # attention heads
  n_layers: 2              # Transformer encoder layers
  ff_dim: 128              # feed-forward inner dimension
  dropout: 0.15
  epochs: 30
  batch_size: 32
  retrain_days: 63         # retrain every 63 trading days
  mc_samples: 10           # MC Dropout forward passes at inference
  forward_horizon: 5
  min_oot_accuracy: 0.52

# Async Pipeline (Gap 4)
async:
  max_workers: 4           # ThreadPoolExecutor concurrency

# Capital Validation (Gap 5)
capital_validation:
  min_paper_days: 30
  min_paper_sharpe: 1.0
  divergence_sigma: 2.0
  ramp_stages:
    - name: Paper Validation
      capital_pct: 0.0
      min_days: 30
      min_sharpe: 1.0
      max_drawdown_pct: 10.0
    - name: Seed Capital
      capital_pct: 0.10
      min_days: 14
      min_sharpe: 0.8
      max_drawdown_pct: 5.0
    - name: Quarter Capital
      capital_pct: 0.25
      min_days: 21
      min_sharpe: 0.6
      max_drawdown_pct: 7.0
    - name: Half Capital
      capital_pct: 0.50
      min_days: 21
      min_sharpe: 0.5
      max_drawdown_pct: 8.0
    - name: Full Capital
      capital_pct: 1.00
      min_days: 0
      min_sharpe: 0.0
      max_drawdown_pct: 10.0

# Bayesian Tuning (Gap 3)
optuna:
  ensemble_trials: 50
  alpha_trials: 30
  timeout_sec: 600
  db_path: data/optuna_study.db

options_intelligence:
  enabled: false
  log_only_mode: false
  cache_ttl_minutes: 5
  nse_session_timeout: 10
  initial_ic_weight: 0.08
  cold_start_bars: 63
  max_strikes_for_gex: 50
  risk_free_rate: 0.065

webhook:
  enabled: false
  secret_token: "CHANGE_ME"
  outgoing_url: ""
  rate_limit_per_min: 60
  max_webhook_kelly: 0.05

meta_controls:
  enabled: true
  shadow_mode: true
  enforce_execution_gates: false
  data_confidence:
    enabled: true
    block_threshold: 0.5
    degrade_threshold: 0.7
    cache_ttl_seconds: 60
  kelly_shrinkage:
    enabled: true
    max_equity_pct_per_trade: 2.0
  calibration_freshness:
    enabled: true
    stale_days: 14
    critical_days: 30
  alert_filter:
    enabled: true
    active_assets: ["BTC"]
  regime_explainer:
    enabled: true
